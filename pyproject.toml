[project]
name = "simo-tools"
version = "0.1.0"
description = "A macOS-first realtime voice-agent runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "tiktoken>=0.13,<1",
]

[project.scripts]
simo = "simo.cli:main"

[project.optional-dependencies]
runtime = [
    # NLTK 3.10's import guard misclassifies dependencies in a project-local
    # virtual environment as current-directory imports.
    "nltk>=3.10.0,<3.10.1",
    "pipecat-ai[local]",
]
inference = [
    "mlx-audio>=0.4.6",
    "mlx-lm>=0.31.3",
    "parakeet-mlx>=0.5.2",
]
dev = [
    "pyright==1.1.411",
    "ruff==0.12.11",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.uv]
package = true

[tool.uv.sources]
pipecat-ai = { path = "vendor/pipecat" }

[tool.pyright]
include = ["python/simo"]
exclude = ["vendor"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
extend-exclude = ["vendor"]
target-version = "py311"
