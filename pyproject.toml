[project]
name = "simo-tools"
version = "0.1.0"
description = "Deterministic repository tooling for Simo"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
    "tiktoken>=0.13,<1",
]

[project.optional-dependencies]
runtime = [
    "pipecat-ai",
]

[tool.uv]
package = false

[tool.uv.sources]
pipecat-ai = { path = "vendor/pipecat" }
